<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oi card</title>
<style>
  body { font: 18px/1.4 -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 32px 20px; color: #111; background: #fff; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  p { color: #666; margin: 0 0 24px; }
  a.button { display: block; text-align: center; background: #1f3864; color: #fff; text-decoration: none;
             font-weight: 700; padding: 18px; border-radius: 12px; font-size: 20px; }
</style>
</head>
<body>
<h1 id="code">Oi card</h1>
<p id="msg">Opening the card's status page.</p>
<a id="go" class="button" href="https://script.google.com/macros/s/AKfycbwK17tqJC1kY8HJACM2uH0aqJaSnwgTfXHDKRzBJD1SGi8IgjY1QQxgl381K2ZHq96K/exec">Open card status</a>
<script>
  // A tag carries https://osimages.github.io/oi/SD-04. This page forwards to the card's status
  // page and keeps a button on screen in case the phone does not follow the forward.
  var BASE = 'https://script.google.com/macros/s/AKfycbwK17tqJC1kY8HJACM2uH0aqJaSnwgTfXHDKRzBJD1SGi8IgjY1QQxgl381K2ZHq96K/exec';
  var parts = location.pathname.split('/').filter(function (p) { return p; }).reverse();
  var code = '';
  for (var i = 0; i < parts.length; i++) {
    var p = decodeURIComponent(parts[i]).toUpperCase();
    if (/^[A-Z]{2,3}-\d{2,}$/.test(p)) { code = p; break; }
  }
  var url = code ? BASE + '?card=' + code : BASE;
  document.getElementById('go').href = url;
  document.getElementById('go').textContent = code ? 'Open ' + code : 'Open all cards';
  document.getElementById('code').textContent = code || 'Oi cards';
  location.href = url;
</script>
</body>
</html>
